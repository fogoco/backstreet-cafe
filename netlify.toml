[build]
  publish = "."

# Canonical domain: send the Netlify subdomain to backstreetcafe.com.au
# so search engines never index duplicate copies of the site.
[[redirects]]
  from = "https://backstreet-cafe.netlify.app/*"
  to = "https://backstreetcafe.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/backstreet-cafe.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The whole repo root is published, so keep build/source files out of the
# public site instead of serving them as static assets.
[[redirects]]
  from = "/src/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/vite.config.js"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/backstreet_cafe_landing_preview.jsx"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/"
  to = "/backstreet-cafe.html"
  status = 200
  force = true

# A request can match several rules at once, and which one wins for a given
# header is not worth betting the menu on: an earlier attempt that set
# Cache-Control on both "/assets/*" and "/assets/menu-browser.js" saw the
# broad rule win in production. So no two rules below set Cache-Control for
# the same path, and each repeats the security headers it needs.

# The menu manager is staff-only: keep it out of search results and caches.
# Access itself is enforced by Supabase Auth plus Row Level Security.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The photos and the hero video are almost the whole weight of the page and
# their filenames never change, so browsers and the CDN can keep them a year.
# Everything else, including the menu scripts and the offline copy of the
# menu, is left on Netlify's default of revalidating each visit. Those files
# keep their names too, so a long cache would strand returning visitors on an
# old menu, sections the cafe has since hidden included. The ETag keeps the
# check down to a 304.
[[headers]]
  for = "/assets/media/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
